# =============================================================================
# hermes-247.yml — Run the Hermes Agent 24/7 on a self-hosted GitHub runner.
#
# How 24/7 actually works (per official Hermes Agent docs / design):
#   * The runner machine itself is the permanent host. On Linux hosts with
#     systemd, `hermes gateway install --start-now` installs + starts a
#     "hermes-gateway" systemd unit that autostarts at boot and restarts on
#     crash  — this is the durable 24/7 process.
#   * On container/WSL/Termux runners (no systemd) the docs recommend running
#     `hermes gateway run` in the foreground; gateway-keepalive.sh wraps that
#     in a bounded auto-restart loop.
#   * A cron-scheduled job re-runs install + config + health-check every 15
#     minutes, which is the self-healing watchdog: if the gateway ever dies,
#     the next run revives it.
#
# Examples of 24/7 pattern on real runners:
#   Linux w/ systemd : gateway service (persistent) + cron watchdog
#   Docker/WSL runner: foreground supervisor loop via this job + cron watchdog
# =============================================================================
name: "Hermes Agent 24/7"

on:
  schedule:
    # Runs every 15 minutes as a health-check and self-healing watchdog.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "guard"
        type: choice
        options:
          - "guard"
          - "self-test"
          - "both"
      gateway_mode:
        description: "Gateway execution mode"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "service"
          - "daemon"
          - "foreground"

concurrency:
  group: hermes-247
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: install + configure + keep the gateway alive 24/7
  # ---------------------------------------------------------------------------
  install-and-guard:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'guard' || inputs.action == 'both' || inputs.action == '' }}
    runs-on: [self-hosted, hermes]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hermes + configure credentials
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY:        ${{ secrets.GOOGLE_API_KEY }}
          HERMES_PROVIDER:       ${{ secrets.HERMES_PROVIDER || 'gemini' }}
          HERMES_DEFAULT_MODEL:  ${{ secrets.HERMES_DEFAULT_MODEL || 'gemini-3.6-flash' }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_GUEST_MODE:   ${{ secrets.TELEGRAM_GUEST_MODE }}
        run: |
          chmod +x hermes-agent/install-hermes.sh
          ./hermes-agent/install-hermes.sh

      - name: Gateway keep-alive watchdog
        env:
          GATEWAY_MAX_RESTARTS: "10"
          GATEWAY_MODE: ${{ inputs.gateway_mode || 'auto' }}
        run: |
          chmod +x hermes-agent/gateway-keepalive.sh
          ./hermes-agent/gateway-keepalive.sh

  # ---------------------------------------------------------------------------
  # Job 2: Non-interactive LLM smoke test against Google Gemini
  # ---------------------------------------------------------------------------
  self-test:
    if: ${{ inputs.action == 'self-test' || inputs.action == 'both' }}
    runs-on: [self-hosted, hermes]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hermes + configure credentials (idempotent)
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY:        ${{ secrets.GOOGLE_API_KEY }}
          HERMES_PROVIDER:       ${{ secrets.HERMES_PROVIDER || 'gemini' }}
          HERMES_DEFAULT_MODEL:  ${{ secrets.HERMES_DEFAULT_MODEL || 'gemini-3.6-flash' }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_GUEST_MODE:   ${{ secrets.TELEGRAM_GUEST_MODE }}
        run: |
          chmod +x hermes-agent/install-hermes.sh
          ./hermes-agent/install-hermes.sh

      - name: End-to-end smoke test
        run: |
          set -e
          # Detect hermes path
          HERMES_BIN="$(command -v hermes || echo "$HOME/.local/bin/hermes")"
          echo "Testing Hermes one-shot response via configured provider..."
          RESP="$("$HERMES_BIN" -z "Reply with exactly: HERMES_ONLINE")"
          echo "Agent Response: $RESP"
          if echo "$RESP" | grep -q "HERMES_ONLINE"; then
            echo "Smoke test passed successfully! ✅"
          else
            echo "Smoke test did not return expected marker. Output was: $RESP" >&2
            exit 1
          fi